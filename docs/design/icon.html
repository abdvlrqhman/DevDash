<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DevDash app icon</title>
<style>
  /* Full-bleed app icon source. ?mask=1 shrinks the mark into Android's maskable safe zone. Rendered to PNGs by CI-free script. */
  html, body { margin: 0; height: 100%; background: #13201B; }
  svg { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<svg viewBox="0 0 64 64" aria-hidden="true">
  <rect width="64" height="64" fill="#13201B"/>
  <g id="m" transform="translate(2 -0.5)">
    <g fill="#EEF4F0">
      <rect x="31" y="7.5" width="11" height="11" rx="1.6"/><rect x="44" y="7.5" width="11" height="11" rx="1.6"/>
      <rect x="44" y="20.5" width="11" height="11" rx="1.6"/><rect x="44" y="33.5" width="11" height="11" rx="1.6"/>
      <rect x="5" y="46.5" width="11" height="11" rx="1.6"/><rect x="18" y="46.5" width="11" height="11" rx="1.6"/>
      <rect x="31" y="46.5" width="11" height="11" rx="1.6"/><rect x="44" y="46.5" width="11" height="11" rx="1.6"/>
    </g>
    <rect x="18" y="20.5" width="11" height="24" rx="1.6" fill="#E3B45A"/>
  </g>
</svg>
<script>
  const s = new URLSearchParams(location.search)
  const scale = s.get('mask') ? 0.62 : 0.84
  document.getElementById('m').setAttribute('transform', `translate(32 32) scale(${scale}) translate(-30 -32.5)`)
</script>
</body>
</html>
