name: App release

# Builds the native DevDash app (apps/shell) and attaches installers to a GitHub release.
# Trigger: push a tag like app-v0.1.0, or run manually with a version.
on:
  push:
    tags: ['app-v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version (e.g. 0.1.0)
        required: true
      platforms:
        description: Which apps to build
        default: windows,android,ios

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || format('app-v{0}', inputs.version) }}

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Create the release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "DevDash app ${TAG#app-v}" --notes "$(cat <<'EOF'
          Install the app, then enter your space address (for example dev.example.com).

          - **Windows:** `DevDash_*_x64-setup.exe`
          - **Android:** `DevDash-*.apk` (allow installs from your browser or files app)
          - **iPhone / iPad:** `DevDash-*-unsigned.ipa`, install with AltStore or SideStore. Or open your space in Safari and use Share, Add to Home Screen.
          EOF
          )"

  windows:
    needs: release
    if: contains(inputs.platforms || 'windows,android,ios', 'windows')
    runs-on: windows-latest
    defaults: { run: { working-directory: apps/shell } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: apps/shell/src-tauri }
      - run: npm ci --no-fund --no-audit
      - run: npx tauri build
      - name: Upload installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/msi/*.msi --clobber --repo "$GITHUB_REPOSITORY"

  android:
    needs: release
    if: contains(inputs.platforms || 'windows,android,ios', 'android')
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: apps/shell } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: 17 }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: apps/shell/src-tauri }
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - run: npm ci --no-fund --no-audit
      - name: Build APK
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android init --ci
          npx tauri icon app-icon.png
          main=$(find src-tauri/gen/android -name MainActivity.kt | head -1)
          echo "generated $main:"; cat "$main"
          cp android/MainActivity.kt "$main"
          npx tauri android build --apk --ci
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          unsigned=$(find src-tauri/gen/android/app/build/outputs/apk -name '*universal*release*.apk' | head -1)
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$tools/zipalign" -f -p 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS --ks-key-alias devdash \
            --out "$RUNNER_TEMP/DevDash-${TAG#app-v}.apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify "$RUNNER_TEMP/DevDash-${TAG#app-v}.apk"
          rm "$RUNNER_TEMP/release.jks"
      - name: Upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/DevDash-${TAG#app-v}.apk" --clobber --repo "$GITHUB_REPOSITORY"

  ios:
    needs: release
    if: contains(inputs.platforms || 'windows,android,ios', 'ios')
    runs-on: macos-15
    defaults: { run: { working-directory: apps/shell } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: apps/shell/src-tauri }
      - run: rustup target add aarch64-apple-ios
      - run: npm ci --no-fund --no-audit
      - name: Build unsigned IPA (sideload with AltStore or SideStore)
        run: |
          npx tauri ios init --ci
          npx tauri icon app-icon.png
          npx tauri ios build --no-sign --ci
          out="$RUNNER_TEMP/DevDash-${TAG#app-v}-unsigned.ipa"
          ipa=$(find src-tauri/gen/apple/build -name '*.ipa' | head -1)
          if [ -n "$ipa" ]; then cp "$ipa" "$out"; else
            # No IPA exported without signing: package the built .app the way an IPA is laid out.
            app=$(find src-tauri/gen/apple/build -maxdepth 6 -type d -path '*.xcarchive/Products/Applications/*.app' | head -1)
            [ -n "$app" ] || app=$(find src-tauri/gen/apple/build -name '*.app' -type d | head -1)
            [ -n "$app" ] || { echo "no .app found"; find src-tauri/gen/apple/build -maxdepth 4; exit 1; }
            mkdir -p "$RUNNER_TEMP/pkg/Payload" && cp -R "$app" "$RUNNER_TEMP/pkg/Payload/"
            (cd "$RUNNER_TEMP/pkg" && zip -qry "$out" Payload)
          fi
          ls -la "$out"
      - name: Upload IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/DevDash-${TAG#app-v}-unsigned.ipa" --clobber --repo "$GITHUB_REPOSITORY"
